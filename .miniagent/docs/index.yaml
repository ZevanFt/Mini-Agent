# 编程语言文档索引

## 配置选项
default_region: china  # global, china, us, eu
prefer_mirror: true   # 是否优先使用镜像源

## 文档源

### JavaScript/TypeScript
javascript:
  name: JavaScript
  official:
    - name: MDN Web Docs
      url: https://developer.mozilla.org/docs/Web/JavaScript
      region: global
  mirrors:
    - name: MDN 中文网
      url: https://developer.mozilla.org/zh-CN/docs/Web/JavaScript
      region: china
  quick_ref:
    - name: ES6+ 语法速查
      url: https://es6.ruanyifeng.com/
      region: china

typescript:
  name: TypeScript
  official:
    - name: TypeScript 官方文档
      url: https://www.typescriptlang.org/docs
      region: global
  mirrors:
    - name: TypeScript 中文手册
      url: https://typescript.bootcss.com/
      region: china
  quick_ref:
